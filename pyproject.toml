[project]
name = "docket"
version = "1.0.0"
description = "Tasks, cached for reading and persisted through a proxy"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.0",
    "gunicorn==23.0.0",
    # psycopg 3 with the C speedups and its own pool.
    "psycopg[binary,pool]==3.2.3",
    "redis==5.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
    "fakeredis==2.26.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
