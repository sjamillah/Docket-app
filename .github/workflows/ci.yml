name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# Read-only by default; only the job that talks to AWS gets a token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # No pip cache: install-deps.sh passes --no-cache-dir for the image
          # build, so there is nothing on disk for the post step to save.

      - run: bash scripts/install-deps.sh --dev
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  build:
    name: Build and push
    needs: test
    # Pull requests stop after the tests. The OIDC trust would refuse them
    # anyway, since it is pinned to main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      # Local build tag only; the published name comes from the secret.
      IMAGE: ci-candidate

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          # :latest is the only tag in ECR, so the commit travels inside the
          # image instead. docker inspect on a digest still names its source.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          platforms: linux/amd64
          # Attestations add an unknown/unknown entry to the image index that
          # confuses ECS and CodeDeploy.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Before any AWS credentials exist, so a broken image never reaches them.
      - name: Smoke test
        run: bash scripts/smoke-test.sh "$IMAGE"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ci-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      # Before the image, deliberately. Pushing :latest is what fires the
      # EventBridge rule, so the descriptors have to already be in place by
      # the time the pipeline starts reading them.
      - name: Publish deploy config
        run: bash scripts/publish-deploy-config.sh

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The repository name is published to Parameter Store by the ECR stack
      # that creates it, so it is resolved here rather than kept as a secret.
      - name: Publish image
        run: |
          repository="$(aws ssm get-parameter --name /docket/ecr-repository-name --query Parameter.Value --output text)"
          bash scripts/publish-image.sh "$IMAGE" "${{ steps.ecr.outputs.registry }}" "$repository"
