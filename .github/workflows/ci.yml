name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build, publish and push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ci-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build
        run: docker build -t ci-candidate .

      # Before the push, not after: moving :latest is what fires the
      # EventBridge rule, so the descriptors have to already be in place by
      # the time the pipeline starts reading them.
      - name: Publish deploy config
        run: bash scripts/publish-deploy-config.sh

      - name: Push image
        run: |
          repository="$(aws ssm get-parameter --name /docket/ecr-repository-name --query Parameter.Value --output text)"
          bash scripts/publish-image.sh ci-candidate "${{ steps.ecr.outputs.registry }}" "$repository"
